name: Changesets

# Runs on every push to main. If there are pending changesets in `.changeset/`,
# the action opens (or updates) a "Version Packages" PR that bumps versions and
# writes CHANGELOG.md. When that PR is merged, the action runs again and (since
# no changesets remain) calls `changeset publish` — which publishes to npm and
# pushes a `vX.Y.Z` git tag. On publish, we ALSO build the Python wheel and
# push to PyPI via trusted publishing (OIDC, no token).

on:
  push:
    branches: [main]

# `contents: write` lets the action push the version-bump commit and tags.
# `pull-requests: write` lets it open/update the "Version Packages" PR.
# `id-token: write` lets npm (trusted publishing) and PyPI authenticate via OIDC.
permissions:
  contents: write
  pull-requests: write
  id-token: write

# Avoid clobbering a still-running version PR if main is updated in quick
# succession.
concurrency:
  group: changesets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # PyPI trusted publishing matches against the workflow + environment, so
    # this `environment:` block has to match the "pending publisher" config at
    # pypi.org/manage/account/publishing/.
    environment:
      name: release
      url: https://pypi.org/project/runfile-ai-schemas/
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so changesets can compute changelog entries against
          # the last tag.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      # npm publishes via trusted publishing (OIDC): npmjs.com trusts this
      # workflow + the `release` environment, so there is no NPM_TOKEN to
      # store or expire. Don't pass `registry-url:` here — setup-node would
      # write an .npmrc expecting a token.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; Node 20 ships npm 10. The
      # publish itself runs `npm publish` (see `changeset:publish` in
      # package.json) rather than `changeset publish`, which would use
      # `pnpm publish` in this pnpm repo.
      - run: npm install -g npm@11

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - run: pnpm install --frozen-lockfile
      - run: pip install 'datamodel-code-generator==0.57.0' 'pydantic>=2.5'

      # Generate + verify before any publish can happen. The version PR also
      # passes through CI on the next push, but running it here is a final
      # belt-and-suspenders check on the merge commit itself.
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run generate
      - run: pnpm run check-drift

      - name: Create Version PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          # When there are no pending changesets (i.e. the version PR just
          # merged), `publish` runs and ships to npm + tags. Otherwise the
          # action just opens/updates the version PR.
          version: pnpm changeset:version
          publish: pnpm changeset:publish
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        # No NPM_TOKEN: with none set and `id-token: write`, changesets/action
        # leaves npm auth to trusted publishing.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ----- PyPI publish ------------------------------------------------
      # Only runs when changesets/action above actually published (i.e. the
      # Version Packages PR just merged). Skipped on regular pushes that just
      # open/update the Version PR.
      - name: Install Python build tooling
        if: steps.changesets.outputs.published == 'true'
        run: pip install build

      - name: Build PyPI wheel + sdist
        if: steps.changesets.outputs.published == 'true'
        run: python -m build generated/python

      - name: Publish to PyPI
        if: steps.changesets.outputs.published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: generated/python/dist
          # Trusted publishing — PyPI verifies the GitHub OIDC token against
          # the publisher configured at pypi.org/manage/account/publishing/.
          # No `password:` field on purpose.
