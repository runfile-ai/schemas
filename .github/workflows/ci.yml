name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      - run: pnpm install --frozen-lockfile
      # Exact pin on datamodel-code-generator: check-drift compares generated
      # bytes, and its output changes across releases — 0.57 emits the
      # required-nullable form (no `= None` default for Zod `.nullable()`) and
      # applies `constr(pattern=...)` to dict keys, while 0.83 renames models
      # (`Labels` → `LabelsModel`) and relaxes literal defaults. A floating range
      # turns every upstream release into a drift failure. Bump deliberately:
      # regenerate locally with the new version and commit the result. Keep in
      # sync with changesets.yml.
      - run: pip install 'datamodel-code-generator==0.57.0' 'pydantic>=2.5'

      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run generate
      - run: pnpm run check-drift
      - run: pnpm run build

      # Cross-language canonical-JSON parity: Python and Go must reproduce
      # the same bytes as the TS leg for every fixture in
      # tests/fixtures/canonical-vectors.json.
      - name: Python canonical parity
        run: |
          pip install ./generated/python
          python -m unittest discover -s tests/python -v
      - name: Go canonical parity
        run: go test ./tests/go/...
